<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lâmpada</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <main class="container">

      <section class="card white">

        <!-- TÍTULO -->
        <h1 class="titulo">Sistema de Lâmpada</h1>

        <!-- IMAGEM -->
        <div class="lampada-box">
          <img
            id="lampada"
            src="img/apagada.png"
            alt="Lâmpada apagada"
          />
        </div>

        <!-- MENSAGEM -->
        <p class="mensagem">Lâmpada apagada!</p>

        <!-- BOTÕES -->
        <div class="buttons">

          <button class="btn-acender">
            Acender <br />
            Lâmpada
          </button>

          <button class="btn-apagar">
            Apagar <br />
            Lâmpada
          </button>

          <button class="btn-quebrar">
            Quebrar <br />
            Lâmpada
          </button>

          <button class="btn-trocar">
            Trocar <br />
            Lâmpada
          </button>

        </div>

      </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

  </body>
</html>
